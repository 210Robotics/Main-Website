services:
  - type: web
    name: 210-robotics-discord-voice-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_VOICE_WORKER_SECRET
        sync: false
      - key: SITE_URL
        value: https://210robotics.com
      - key: VOICE_IDLE_TIMEOUT_MINUTES
        value: "10"
      - key: VOICE_MAX_RECONNECT_ATTEMPTS
        value: "8"
      - key: VOICE_RECONNECT_BASE_DELAY
        value: "1500"
